name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[ingestion,retrieval,web,agent,mcp,dev]"
      - run: python -m pytest
      - name: Reject private data artifacts
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(pdf|faiss|sqlite|sqlite3|npy|npz|onnx|safetensors|pt|pth|gguf)$'; then
            echo "Private or generated data artifact is tracked."
            exit 1
          fi
          if git ls-files '*.jsonl' \
            | grep -Ev '^(evaluation/datasets/|tests/fixtures/)'; then
            echo "Unapproved JSONL is tracked; source bodies and generated JSONL must remain local."
            exit 1
          fi
