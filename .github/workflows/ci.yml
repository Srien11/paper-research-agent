name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[ingestion]"
      - run: python -m unittest discover -s tests -v
      - name: Reject private data artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '\.(pdf|faiss|sqlite|sqlite3)$'; then
            echo "Private or generated data artifact is tracked."
            exit 1
          fi
