# Include this file from the existing zhimoai.online server block as:
# include /etc/nginx/snippets/paper-research-agent.conf;

location = /paper-research {
    return 308 /paper-research/;
}

location = /paper-research/api/login {
    client_max_body_size 16k;
    limit_req zone=paper_research_login burst=3 nodelay;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /paper-research;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location = /paper-research/api/ask {
    client_max_body_size 16k;
    limit_req zone=paper_research_ask burst=2 nodelay;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /paper-research;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 90s;
}

location = /paper-research/api/chat/stream {
    client_max_body_size 16k;
    limit_req zone=paper_research_ask burst=2 nodelay;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
}

location = /paper-research/api/files {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

location ^~ /paper-research/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /paper-research;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
}
