[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
version = "0.1.0"
description = "面向小型论文语料的可复现、证据可追溯 RAG 检索基线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
ingestion = [
  "pdfplumber>=0.11.10,<0.12",
  "pypdf>=6.14,<7",
  "pypdfium2>=5.12,<6",
  "Pillow>=12.3,<13",
]
retrieval = [
  "numpy>=2.2,<3",
  "fastembed>=0.8,<0.9",
  "faiss-cpu>=1.14,<1.15",
]
web = [
  "fastapi>=0.139,<0.140",
  "uvicorn>=0.40,<0.52",
]
agent = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
]
dev = [
  "mypy>=1.15",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_research_agent = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["paper_research_agent"]
